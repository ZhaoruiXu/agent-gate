[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gate"
version = "0.1.0"
description = "Agent Gate: safe tool-calling harness with risk-tiered tools, approval policy, hash-chained audit log, and eval harness."
requires-python = ">=3.10"
dependencies = ["mcp>=1.0", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]
