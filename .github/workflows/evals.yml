name: evals

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        mcp-version: ["1.30.0", "2.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "mcp==${{ matrix.mcp-version }}"
      - name: Run evals
        # --no-skip turns a SKIP into a FAIL for the live MCP evals:
        # in CI the mcp package is always installed, so they must
        # really run, never silently skip.
        run: python evals/run_evals.py --no-skip server_real_session mcp_unknown_arg_rejected
